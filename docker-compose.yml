services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - gateway
      - notification-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      API_GATEWAY_URL: ""
      NEXT_PUBLIC_API_GATEWAY_URL: ""
      NEXT_PUBLIC_NOTIFICATION_SERVICE_URL: ""
    depends_on:
      - gateway

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      FRONTEND_URL: http://localhost
      AUTH_SERVICE_URL: http://auth-service:3000
      CART_SERVICE_URL: http://cart-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      PRODUCT_SERVICE_URL: http://product-service:3004
      REVIEW_SERVICE_URL: http://review-service:3005
    env_file:
      - ./backend/gateway/.env
    depends_on:
      - auth-service
      - cart-service
      - order-service
      - inventory-service
      - product-service
      - review-service

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_GATEWAY_URL: http://gateway:8080
    env_file:
      - ./backend/services/auth-service/.env

  cart-service:
    build:
      context: ./backend/services/cart-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_GATEWAY_URL: http://gateway:8080
      REDIS_ENDPOINT: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
    env_file:
      - ./backend/services/cart-service/.env
    depends_on:
      - redis

  order-service:
    build:
      context: ./backend/services/order-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      API_GATEWAY_URL: http://gateway:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:4000/notification-service
    env_file:
      - ./backend/services/order-service/.env

  inventory-service:
    build:
      context: ./backend/services/inventory-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      API_GATEWAY_URL: http://gateway:8080
    env_file:
      - ./backend/services/inventory-service/.env

  product-service:
    build:
      context: ./backend/services/product-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      PORT: 3004
      API_GATEWAY_URL: http://gateway:8080
    env_file:
      - ./backend/services/product-service/.env

  review-service:
    build:
      context: ./backend/services/review-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      API_GATEWAY_URL: http://gateway:8080
    env_file:
      - ./backend/services/review-service/.env

  notification-service:
    build:
      context: ./backend/services/notification-service
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:8000
      REDIS_ENDPOINT: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
      RABBITMQ_URL: amqp://rabbitmq:5672
    env_file:
      - ./backend/services/notification-service/.env
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
